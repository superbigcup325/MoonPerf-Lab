schema_version = 1
name = "sql-groupby"
version = 1
status = "active"
tier = "end-to-end"
summary = "Parse a CSV table and answer one fixed GROUP BY: the Moonlake engine path against hand-written MoonBit, Rust and C pipelines over the same bytes."

[dataset]
generator = "csv-records"
count = 2_000_000
seed = 20261026

[dataset.params]
categories = 16
amount_max = 1_000_000

[params]

[verify]
mode = "exact"
fields = ["groups", "rows", "checksum"]
reference = "rust"

[measurement]
warmup = 3
repeats = 20
timeout_s = 120
inner_repeats = 10
max_cv = 0.05

[matrix.many-groups]
status = "probe"
description = "categories = 4096: the dense aggregate table is full, so grouped writes scatter and the output has 4096 rows. Stresses the aggregation instead of the parse."
[matrix.many-groups.dataset_params]
categories = 4096

[matrix.single-group]
status = "probe"
description = "categories = 1: one accumulator, so the sample is dominated by CSV parsing and the scan. The floor for the parse side of the end-to-end path."
[matrix.single-group.dataset_params]
categories = 1

[matrix.small]
status = "rejected"
description = "count = 200000: a 3.3 MB table, so process startup and the page cache dominate the sample. Below the noise gate; the reason the recorded size is 2M."
count = 200000
