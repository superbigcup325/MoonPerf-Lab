schema_version = 1
name = "hash-join"
version = 1
status = "active"
tier = "component"
summary = "Build a hash table over the first half of a record stream and probe it with the second half; count the matching (build, probe) pairs and checksum their payloads."

[dataset]
generator = "structured-records"
count = 1_000_000
seed = 20261024

[dataset.params]
key_bits = 20
payload_min = 0
payload_max = 1_000_000

[verify]
mode = "exact"
fields = ["build_rows", "probe_rows", "pairs", "checksum"]
reference = "rust"

[measurement]
warmup = 3
repeats = 20
timeout_s = 120
inner_repeats = 20
max_cv = 0.05

[matrix.few-keys]
status = "probe"
description = "key_bits = 12: 4096 distinct keys, so most probes walk a long build chain. The kernel becomes hash-probe bound rather than cache bound, and the checksum moves with it."
[matrix.few-keys.dataset_params]
key_bits = 12

[matrix.wide-keys]
status = "probe"
description = "key_bits = 24: 16.7M distinct keys, so the build table is mostly unique and most probes miss. Measures the lookup-miss path instead of match processing."
[matrix.wide-keys.dataset_params]
key_bits = 24

[matrix.small]
status = "rejected"
description = "count = 200000: a 100k-entry table fits in L2 and the kernel is short, so the join stops being cache bound and the samples get noisy."
count = 200000
