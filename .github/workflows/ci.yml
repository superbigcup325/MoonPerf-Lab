name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the harness
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate every workload, adapter and schema
        run: mpf validate
      - name: List workloads
        run: mpf list

  moonbit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Toolchain version
        run: moon version
      - name: Update the registry
        working-directory: moonperf
        run: moon update
      - name: Check the core
        working-directory: moonperf
        run: moon check --deny-warn --target native
      - name: Test the core
        working-directory: moonperf
        run: moon test --target native
      - name: Check formatting
        working-directory: moonperf
        run: moon fmt --check
      - name: Validate the workloads with the core
        working-directory: moonperf
        run: moon run cli --target native -- validate ../workloads
      - name: Check the MoonBit adapter
        working-directory: workloads/numeric-scan/implementations/moonbit
        run: |
          moon check --deny-warn --target native
          moon fmt --check
      - name: Regenerate the committed report
        working-directory: moonperf
        run: |
          mkdir -p ../results/tmp
          moon run cli --target native -- report \
            ../results/numeric-scan/20261021T053956Z-f1d6607a505a.json \
            --out ../results/tmp/ci-report.md
          diff -u \
            ../results/numeric-scan/20261021T053956Z-f1d6607a505a.md \
            ../results/tmp/ci-report.md

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain version
        run: rustc --version
      - name: Build the reference adapter
        working-directory: workloads/numeric-scan/implementations/rust
        run: ./build.sh

  c-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the harness oracle
        run: python -m pip install -e .
      - name: Toolchain versions
        run: |
          cc --version | head -n 1
          rustc --version
      - name: Build the C adapter
        working-directory: workloads/numeric-scan/implementations/c
        run: ./build.sh
      - name: Build the Rust reference
        working-directory: workloads/numeric-scan/implementations/rust
        run: ./build.sh
      - name: Cross-check the C output against the Rust reference
        run: python scripts/crosscheck-workload.py numeric-scan --subject c --repeat 3

  hash-join:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the harness oracle
        run: python -m pip install -e .
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Update the registry
        working-directory: moonperf
        run: moon update
      - name: Build the MoonBit implementation
        working-directory: workloads/hash-join/implementations/moonbit
        run: ./build.sh
      - name: Build the Rust and C implementations
        working-directory: workloads/hash-join/implementations
        run: |
          ./rust/build.sh
          ./c/build.sh
      - name: Generate the dataset with the core
        working-directory: moonperf
        run: |
          mkdir -p ../results/tmp
          moon run cli --target native -- dataset \
            --manifest ../workloads/hash-join/workload.toml \
            --out ../results/tmp/hash-join-dataset.bin \
            | tee ../results/tmp/hash-join-identity.txt
          grep -q a413e1deb6d87790988d4331fcc264d4d12047c1b0f789134796812ccb0aa23d \
            ../results/tmp/hash-join-identity.txt
      - name: Cross-check MoonBit and C against the Rust reference
        run: |
          python scripts/crosscheck-workload.py hash-join \
            --dataset results/tmp/hash-join-dataset.bin \
            --sha256 a413e1deb6d87790988d4331fcc264d4d12047c1b0f789134796812ccb0aa23d \
            --subject moonbit --subject c --repeat 1

  runner-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the harness
        run: python -m pip install -e .
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Update the registry
        working-directory: moonperf
        run: moon update
      - name: Run the timeout fixture
        working-directory: moonperf
        run: |
          set +e
          moon run cli --target native -- run ../tests/fixtures/demo-scan \
            --out ../results/tmp/ci-fixture --data-dir ../.data --repo-root ..
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "the timeout fixture unexpectedly succeeded"
            exit 1
          fi
      - name: Assert the invalid artifact
        run: |
          python - <<'PY'
          import glob, json, subprocess, sys
          paths = [
              p for p in glob.glob("results/tmp/ci-fixture/*.json")
              if not any(k in p for k in ("sample", "setup", "warmup", "correctness", "scaling"))
          ]
          if len(paths) != 1:
              sys.exit(f"expected one artifact, got {paths}")
          path = paths[0]
          subprocess.run([sys.executable, "-m", "mpf", "validate", "--result", path], check=True)
          data = json.load(open(path, encoding="utf-8"))
          if data["verdict"]["status"] != "invalid":
              sys.exit("timeout fixture did not produce an invalid verdict")
          by_id = {i["id"]: i for i in data["implementations"]}
          beta = by_id["beta"]
          if beta.get("measurement_ok") is not False or beta.get("samples_ns"):
              sys.exit("timeout fixture did not record the measurement failure")
          gamma = by_id["gamma"]
          if gamma["build"]["ok"] or gamma.get("samples_ns"):
              sys.exit("build-failure fixture was not recorded")
          delta = by_id["delta"]
          if delta["correctness"]["ok"] or delta.get("samples_ns"):
              sys.exit("correctness-failure fixture was not recorded")
          print("fault fixture recorded timeout, build and correctness failures")
          PY
