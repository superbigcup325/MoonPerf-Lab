[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moonperf-lab"
version = "0.1.0"
description = "Reproducible performance research for MoonBit: experiment protocol, schemas and harness."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "superbigcup325" }]
keywords = ["moonbit", "benchmark", "performance", "reproducibility"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = ["jsonschema>=4.20,<5"]

[project.scripts]
mpf = "mpf.cli:main"

[project.urls]
Homepage = "https://github.com/superbigcup325/moonperf-lab"

[tool.setuptools]
packages = ["mpf"]
